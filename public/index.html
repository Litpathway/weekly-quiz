<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#191b2e">
<title>Weekly Quiz</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

<link rel="manifest" href="/manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='10' fill='%23191b2e'/><circle cx='16' cy='16' r='7' fill='%23ff5b60'/></svg>">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root {
  --navy: #191b2e;
  --navy-dark: #121324;
  --navy-light: #262940;
  --coral: #ff5b60;
  --coral-hover: #ff474d;
  --coral-light: rgba(255, 91, 96, 0.12);
  --teal: #10b981;
  --teal-light: rgba(16, 185, 129, 0.12);

  --bg-page: #eaedf4;
  --card-bg: #f8f9fc;
  --white: #ffffff;
  --text-dark: #161828;
  --text-sub: #787d94;
  --text-muted: #9ba0b8;
  --border-soft: #edf0f7;
  --shadow-soft: 0 10px 30px rgba(25, 27, 46, 0.05);

  --radius-card: 24px;
  --radius-pill: 999px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  padding: 0;
  background: var(--bg-page);
  color: var(--text-dark);
  font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
:focus-visible { outline: 2.5px solid var(--coral); outline-offset: 2px; }
.hidden { display: none !important; }

/* Large-screen responsive app container (Desktop + Tablet + Mobile) */
.app-container {
  width: 100%;
  max-width: 980px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--card-bg);
  box-shadow: 0 15px 50px rgba(25, 27, 46, 0.08);
  display: flex;
  flex-direction: column;
  position: relative;
}

@media (min-width: 1020px) {
  .app-container {
    margin: 32px auto;
    border-radius: 36px;
    overflow: hidden;
    min-height: 880px;
    border: 1px solid rgba(25, 27, 46, 0.06);
  }
}

/* =====================================================================
   EXACT ASYMMETRICAL S-CURVE TOP
   ===================================================================== */
.mody-top-container {
  position: relative;
  background: var(--navy);
  color: #fff;
  z-index: 2;
  padding-bottom: 50px;
}

.mody-inner-header {
  padding: 36px 32px 18px;
  position: relative;
  z-index: 3;
}

.mody-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.mody-brand {
  font-family: 'Outfit', sans-serif;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.header-icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.09);
  display: grid;
  place-items: center;
  color: #fff;
  font-weight: 700;
  font-size: 16px;
  transition: background 0.15s ease;
}
.header-icon-btn:hover { background: rgba(255, 255, 255, 0.18); }

/* The Exact Asymmetric Wave Curve */
.mody-scurve-divider {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  height: 52px;
  overflow: hidden;
  line-height: 0;
  z-index: 2;
  pointer-events: none;
}

.mody-scurve-divider svg {
  display: block;
  width: 100%;
  height: 100%;
}

/* =====================================================================
   CONTENT WORKSPACE
   ===================================================================== */
.content-area {
  flex: 1;
  padding: 24px 32px 60px;
  position: relative;
  z-index: 1;
}

@media (max-width: 600px) {
  .mody-inner-header { padding: 30px 20px 14px; }
  .content-area { padding: 18px 18px 50px; }
}

/* Week Grid for 1 to 12 */
.weeks-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
  margin-top: 20px;
}

/* Individual Week Card */
.week-card {
  background: var(--white);
  border-radius: var(--radius-card);
  padding: 22px 20px;
  box-shadow: var(--shadow-soft);
  border: 1.5px solid var(--border-soft);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 154px;
  text-align: left;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
  width: 100%;
}

.week-card.available {
  cursor: pointer;
  border-color: #e0e5f2;
}

.week-card.available:hover {
  transform: translateY(-3px);
  border-color: var(--coral);
  box-shadow: 0 14px 30px rgba(25, 27, 46, 0.09);
}

.week-card.available:hover .week-arrow {
  background: var(--coral);
  color: #fff;
  border-color: var(--coral);
  transform: translateX(2px);
}

/* Greyed-out unavailable week */
.week-card.locked {
  background: #f1f3f9;
  border-color: #e8ebf3;
  opacity: 0.62;
  cursor: not-allowed;
}

.week-header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.week-badge {
  font-family: 'Outfit', sans-serif;
  font-size: 13px;
  font-weight: 800;
  padding: 4px 12px;
  border-radius: var(--radius-pill);
}

.week-badge.open {
  background: var(--teal-light);
  color: var(--teal);
}

.week-badge.closed {
  background: #e2e6f0;
  color: var(--text-sub);
}

.week-number-label {
  font-family: 'Outfit', sans-serif;
  font-size: 20px;
  font-weight: 800;
  color: var(--text-dark);
  margin: 0 0 4px;
}

.week-desc {
  font-size: 13px;
  color: var(--text-sub);
  margin: 0;
  line-height: 1.4;
}

.week-bottom-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px dashed var(--border-soft);
}

.week-stats {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
}

.week-arrow {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #f4f6fb;
  border: 1px solid #e2e6f2;
  color: var(--navy);
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 14px;
  transition: all 0.2s ease;
}

/* Module Selection List inside an open week */
.courses-container {
  max-width: 680px;
  margin: 0 auto;
}

.course-select-row {
  background: var(--white);
  border-radius: 20px;
  padding: 18px 20px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 16px;
  box-shadow: var(--shadow-soft);
  border: 1px solid var(--border-soft);
  transition: all 0.2s ease;
  width: 100%;
  text-align: left;
}

.course-select-row:hover {
  transform: translateY(-2px);
  border-color: var(--coral);
}

.course-badge {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  background: var(--coral-light);
  color: var(--coral);
  font-family: 'Outfit', sans-serif;
  font-weight: 800;
  font-size: 16px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

/* Registration Form Card */
.form-wrapper {
  max-width: 540px;
  margin: 0 auto;
}

.reg-card {
  background: var(--white);
  border-radius: var(--radius-card);
  padding: 32px 28px;
  box-shadow: var(--shadow-soft);
  border: 1px solid var(--border-soft);
}

.reg-card h3 {
  font-family: 'Outfit', sans-serif;
  font-size: 22px;
  margin: 0 0 6px;
}

.reg-card p {
  color: var(--text-sub);
  font-size: 14px;
  margin: 0 0 24px;
  line-height: 1.5;
}

.input-group {
  margin-bottom: 18px;
}

.input-group label {
  display: block;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--text-sub);
  margin-bottom: 7px;
}

.input-group input {
  width: 100%;
  background: #f7f8fc;
  border: 1.5px solid #eaedf5;
  border-radius: 16px;
  padding: 14px 16px;
  font-size: 15px;
  color: var(--text-dark);
  font-weight: 600;
  transition: all 0.2s ease;
}

.input-group input:focus {
  background: #fff;
  border-color: var(--coral);
  outline: none;
  box-shadow: 0 0 0 4px var(--coral-light);
}

.btn-coral {
  width: 100%;
  background: var(--coral);
  color: #fff;
  font-family: 'Outfit', sans-serif;
  font-weight: 700;
  font-size: 16px;
  border-radius: 18px;
  padding: 16px;
  box-shadow: 0 10px 24px rgba(255, 91, 96, 0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s ease;
}

.btn-coral:hover {
  background: var(--coral-hover);
  transform: translateY(-1px);
}
.btn-coral:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none;
}

.btn-ghost {
  width: 100%;
  background: transparent;
  color: var(--text-sub);
  font-weight: 600;
  font-size: 14px;
  padding: 12px;
  border-radius: 16px;
  margin-top: 8px;
}

/* Active Quiz Arena */
.quiz-wrapper {
  max-width: 680px;
  margin: 0 auto;
}

.timer-pill {
  background: var(--coral);
  color: #fff;
  padding: 6px 16px;
  border-radius: var(--radius-pill);
  font-family: 'Outfit', sans-serif;
  font-size: 14px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 6px 16px rgba(255, 91, 96, 0.35);
}

.timer-pill.urgent {
  animation: pulse 1s infinite;
  background: #e11d48;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.question-title {
  font-family: 'Outfit', sans-serif;
  font-size: 22px;
  line-height: 1.4;
  font-weight: 700;
  margin: 12px 0 0;
  color: #fff;
}

.segment-bar {
  display: flex;
  gap: 6px;
  margin-top: 20px;
}

.segment-item {
  flex: 1;
  height: 5px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.16);
  transition: background 0.3s ease;
}

.segment-item.filled { background: var(--coral); }

.options-wrap {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.opt-card {
  background: var(--white);
  border: 1.5px solid #edf0f7;
  border-radius: 20px;
  padding: 18px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  text-align: left;
  box-shadow: var(--shadow-soft);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  width: 100%;
}

.opt-card:hover {
  transform: translateY(-2px);
  border-color: #cbd5e1;
}

.opt-card[aria-pressed="true"] {
  border-color: var(--coral);
  background: #fff8f8;
  box-shadow: 0 10px 24px rgba(255, 91, 96, 0.14);
}

.opt-letter {
  width: 34px;
  height: 34px;
  border-radius: 12px;
  background: #f4f5fa;
  color: var(--navy);
  font-weight: 800;
  font-family: 'Outfit', sans-serif;
  font-size: 14px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  transition: all 0.2s ease;
}

.opt-card[aria-pressed="true"] .opt-letter {
  background: var(--coral);
  color: #fff;
}

.opt-text {
  font-size: 15.5px;
  font-weight: 600;
  color: var(--text-dark);
  flex: 1;
}

/* Results Screen */
.results-card {
  background: var(--white);
  border-radius: var(--radius-card);
  padding: 40px 28px;
  text-align: center;
  box-shadow: var(--shadow-soft);
  margin-bottom: 24px;
  max-width: 680px;
  margin-left: auto;
  margin-right: auto;
}

.trophy-ring {
  width: 116px;
  height: 116px;
  border-radius: 50%;
  background: #fff5f5;
  border: 4px solid var(--coral);
  display: grid;
  place-items: center;
  margin: 0 auto 18px;
}

.trophy-ring .pct {
  font-family: 'Outfit', sans-serif;
  font-size: 34px;
  font-weight: 800;
  color: var(--coral);
}

.results-card h2 {
  font-family: 'Outfit', sans-serif;
  font-size: 24px;
  margin: 0 0 6px;
}

.results-card p {
  color: var(--text-sub);
  font-size: 14.5px;
  margin: 0 0 24px;
}

.metrics-strip {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 24px;
  max-width: 440px;
  margin-left: auto;
  margin-right: auto;
}

.metric-box {
  background: #f8f9fd;
  border-radius: 16px;
  padding: 14px 16px;
  text-align: center;
}

.metric-box b {
  display: block;
  font-family: 'Outfit', sans-serif;
  font-size: 20px;
  color: var(--text-dark);
}

.metric-box span {
  font-size: 12px;
  color: var(--text-sub);
}

.review-box {
  background: var(--white);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-soft);
  border: 1px solid var(--border-soft);
  max-width: 680px;
  margin-left: auto;
  margin-right: auto;
}

.review-badge-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.review-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 999px;
}

.review-badge.ok { background: var(--teal-light); color: var(--teal); }
.review-badge.no { background: var(--coral-light); color: var(--coral); }

.review-q {
  font-weight: 700;
  font-size: 15px;
  margin: 0 0 10px;
  color: var(--text-dark);
}

.answer-line {
  font-size: 13.5px;
  margin-bottom: 6px;
}
.answer-line.good { color: var(--teal); font-weight: 600; }
.answer-line.bad { color: var(--coral); font-weight: 600; }

.review-why {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed #e2e8f0;
  font-size: 13px;
  color: var(--text-sub);
  line-height: 1.45;
}

/* Toast */
.toast-bar {
  position: fixed;
  top: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--navy);
  color: #fff;
  border-radius: 16px;
  padding: 12px 20px;
  font-size: 13.5px;
  font-weight: 600;
  box-shadow: 0 12px 28px rgba(0,0,0,0.25);
  z-index: 100;
  animation: slideDown 0.25s ease;
  max-width: 400px;
  width: calc(100% - 40px);
}

@keyframes slideDown {
  from { transform: translate(-50%, -20px); opacity: 0; }
  to { transform: translate(-50%, 0); opacity: 1; }
}
</style>
</head>
<body>

<div class="app-container" id="appFrame">
  <div id="view"></div>
  <div id="toastHost" class="hidden"></div>
</div>

<script>
const $view = document.getElementById('view');
const $toastHost = document.getElementById('toastHost');

const pad = n => String(n).padStart(2, '0');

function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    n.append(c.nodeType ? c : document.createTextNode(c));
  }
  return n;
}

/* Exact Asymmetric S-Curve SVG */
function createModyCurveSvg() {
  const div = el('div', { class: 'mody-scurve-divider' });
  div.innerHTML = `
    <svg viewBox="0 0 980 52" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,52 C280,52 480,0 980,0 L980,52 L0,52 Z" fill="#f8f9fc" />
    </svg>
  `;
  return div;
}

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  let j = {};
  try { j = await r.json(); } catch {}
  if (!r.ok) throw new Error(j.error || 'Server error ' + r.status);
  return j;
}

function mount(...nodes) {
  $view.replaceChildren(...nodes);
  window.scrollTo(0, 0);
}

let _toastTimer;
function showToast(msg) {
  $toastHost.classList.remove('hidden');
  $toastHost.replaceChildren(el('div', { class: 'toast-bar' }, msg));
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => {
    $toastHost.classList.add('hidden');
    $toastHost.replaceChildren();
  }, 4000);
}

function launchConfetti() {
  const canvas = Object.assign(document.createElement('canvas'), {
    style: 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99',
  });
  document.body.append(canvas);
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const colours = ['#ff5b60', '#10b981', '#f59e0b', '#3b82f6', '#191b2e'];
  const pieces = Array.from({ length: 60 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * -canvas.height / 2,
    r: Math.random() * 6 + 3,
    c: colours[Math.floor(Math.random() * colours.length)],
    vx: (Math.random() - 0.5) * 3,
    vy: Math.random() * 3.5 + 2,
    rot: Math.random() * 360,
    vr: (Math.random() - 0.5) * 8,
  }));
  let raf;
  (function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
      ctx.restore();
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vy += 0.05;
    });
    if (pieces.some(p => p.y < canvas.height + 10)) raf = requestAnimationFrame(draw);
    else canvas.remove();
  })();
  setTimeout(() => { cancelAnimationFrame(raf); canvas.remove(); }, 3500);
}

let timer = null, S = null, guard = false, _keyHandler = null;
window.addEventListener('beforeunload', e => {
  if (guard) { e.preventDefault(); e.returnValue = ''; }
});

/* ─────────────────────────────────────────────────────────────────────
   HOME SCREEN: WEEKS 1 TO 12 GRID
   ───────────────────────────────────────────────────────────────────── */
async function home() {
  clearInterval(timer);
  guard = false;
  if (_keyHandler) { document.removeEventListener('keydown', _keyHandler); _keyHandler = null; }

  // Clean, neutral header with the signature S-curve (no Modychat branding, no archive, no emojis)
  const topContainer = el('div', { class: 'mody-top-container' },
    el('div', { class: 'mody-inner-header' },
      el('div', { class: 'mody-topbar' },
        el('span', { class: 'mody-brand' }, 'Weekly Quiz'),
        el('div', { style: 'font-size:13px;color:rgba(255,255,255,0.7);font-weight:600' }, 'Academic Portal'))),
    createModyCurveSvg());

  mount(topContainer, el('div', { class: 'content-area' },
    el('div', { style: 'text-align:center;padding:60px 0;color:var(--text-sub)' }, 'Loading course schedule…')));

  let backendWeeks = [];
  try {
    backendWeeks = (await api('/api/weeks')).weeks || [];
  } catch (e) {
    mount(topContainer, el('div', { class: 'content-area' },
      el('div', { class: 'reg-card', style: 'max-width:500px;margin:30px auto;text-align:center' },
        el('h3', {}, 'Connection Error'),
        el('p', {}, e.message),
        el('button', { class: 'btn-coral', onclick: home }, 'Try Again'))));
    return;
  }

  // Create an explicit 1 to 12 Week Grid
  const grid = el('div', { class: 'weeks-grid' });

  for (let wNum = 1; wNum <= 12; wNum++) {
    // Check if week exists in backendWeeks by matching label or index
    const matchingWeek = backendWeeks.find(bw => {
      const match = bw.label && bw.label.match(/Week\s*(\d+)/i);
      return match ? parseInt(match[1], 10) === wNum : false;
    }) || (backendWeeks[wNum - 1] && !backendWeeks[wNum - 1].label.match(/Week\s*\d+/i) ? backendWeeks[wNum - 1] : null);

    const isAvailable = matchingWeek && matchingWeek.open !== false;

    if (isAvailable) {
      const courseCount = matchingWeek.courses ? matchingWeek.courses.length : 0;
      const questionCount = matchingWeek.courses ? matchingWeek.courses.reduce((sum, c) => sum + (c.count || 0), 0) : 0;

      const card = el('div', {
        class: 'week-card available',
        onclick: () => selectWeek(matchingWeek, wNum)
      },
        el('div', {},
          el('div', { class: 'week-header-row' },
            el('span', { class: 'week-badge open' }, 'Available')),
          el('h3', { class: 'week-number-label' }, 'Week ' + wNum),
          el('p', { class: 'week-desc' }, matchingWeek.label || 'Course Assessment Session')),
        el('div', { class: 'week-bottom-row' },
          el('span', { class: 'week-stats' }, courseCount + (courseCount === 1 ? ' Quiz' : ' Quizzes') + ' · ' + questionCount + ' Qs'),
          el('span', { class: 'week-arrow' }, '→')));

      grid.append(card);
    } else {
      // Greyed out / locked week
      const card = el('div', { class: 'week-card locked' },
        el('div', {},
          el('div', { class: 'week-header-row' },
            el('span', { class: 'week-badge closed' }, 'Locked')),
          el('h3', { class: 'week-number-label' }, 'Week ' + wNum),
          el('p', { class: 'week-desc' }, 'Assessment will open during scheduled session.')),
        el('div', { class: 'week-bottom-row' },
          el('span', { class: 'week-stats' }, 'Not Available'),
          el('span', { class: 'week-arrow', style: 'opacity:0.4' }, '—')));

      grid.append(card);
    }
  }

  const contentArea = el('div', { class: 'content-area' },
    el('div', { style: 'display:flex;align-items:center;justify-content:space-between;margin-bottom:8px' },
      el('h2', { style: 'font-family:Outfit,sans-serif;font-size:22px;margin:0' }, 'Academic Schedule'),
      el('span', { style: 'font-size:13px;color:var(--text-sub);font-weight:600' }, 'Semester Modules 1–12')),
    el('p', { style: 'color:var(--text-sub);font-size:14px;margin:0 0 8px' },
      'Select any active week below to start or practice your assessment.'),
    grid);

  mount(topContainer, contentArea);
}

/* ─────────────────────────────────────────────────────────────────────
   WEEK SELECTED: SHOW COURSES / MODULES INSIDE THIS WEEK
   ───────────────────────────────────────────────────────────────────── */
function selectWeek(week, weekNumber) {
  const topContainer = el('div', { class: 'mody-top-container' },
    el('div', { class: 'mody-inner-header' },
      el('div', { class: 'mody-topbar' },
        el('button', { class: 'header-icon-btn', onclick: home }, '←'),
        el('span', { class: 'mody-brand' }, 'Week ' + weekNumber),
        el('div', { style: 'width:40px' })),
      el('div', { style: 'font-size:14px;color:rgba(255,255,255,0.7);margin-top:4px' },
        week.label)),
    createModyCurveSvg());

  const list = el('div', { class: 'courses-container' });

  if (!week.courses || !week.courses.length) {
    list.append(el('div', { class: 'reg-card', style: 'text-align:center' },
      el('h3', {}, 'No courses found'),
      el('p', {}, 'No quizzes are currently uploaded under this week.')));
  } else {
    list.append(
      el('h3', { style: 'font-family:Outfit,sans-serif;font-size:20px;margin:0 0 16px' }, 'Select Assessment Module'),
      ...week.courses.map((c, i) => {
        const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
        const badgeTxt = c.code ? c.code.slice(0, 3).toUpperCase() : (letters[i] || 'Q');

        return el('button', {
          class: 'course-select-row',
          onclick: () => nameForm(week, c)
        },
          el('div', { class: 'course-badge' }, badgeTxt),
          el('div', { style: 'flex:1;min-width:0' },
            el('div', { style: 'font-size:16px;font-weight:700;color:var(--text-dark);margin-bottom:4px' }, c.title),
            el('div', { style: 'font-size:13px;color:var(--text-sub)' },
              (c.code ? c.code + ' · ' : '') + c.count + ' Questions · ' + c.timePerQ + 's each')),
          el('div', { class: 'week-arrow' }, '→'));
      }));
  }

  mount(topContainer, el('div', { class: 'content-area' }, list));
}

/* ─────────────────────────────────────────────────────────────────────
   REGISTRATION FORM
   ───────────────────────────────────────────────────────────────────── */
function nameForm(week, course) {
  const topContainer = el('div', { class: 'mody-top-container' },
    el('div', { class: 'mody-inner-header' },
      el('div', { class: 'mody-topbar' },
        el('button', { class: 'header-icon-btn', onclick: home }, '←'),
        el('span', { class: 'mody-brand' }, 'Registration'),
        el('div', { style: 'width:40px' })),
      el('div', { style: 'font-size:14px;color:rgba(255,255,255,0.7);margin-top:4px' },
        course.title)),
    createModyCurveSvg());

  const nameInput = el('input', {
    id: 'nm',
    placeholder: 'e.g. Adaeze Okafor',
    maxlength: 60,
    value: localStorage.getItem('q_name') || ''
  });

  const contactInput = el('input', {
    id: 'ct',
    placeholder: 'Matric number, email or phone (optional)',
    maxlength: 80,
    value: localStorage.getItem('q_contact') || ''
  });

  const go = () => {
    const n = nameInput.value.trim().replace(/\s+/g, ' ');
    if (n.length < 2) {
      nameInput.focus();
      nameInput.style.borderColor = 'var(--coral)';
      return;
    }
    localStorage.setItem('q_name', n);
    localStorage.setItem('q_contact', contactInput.value.trim());
    begin(week, course, n, contactInput.value.trim());
  };

  const formCard = el('div', { class: 'form-wrapper' },
    el('div', { class: 'reg-card' },
      el('h3', {}, 'Candidate Details'),
      el('p', {}, 'Enter your name to begin. Each question progresses automatically when the countdown expires.'),
      el('div', { class: 'input-group' },
        el('label', { for: 'nm' }, 'FULL NAME *'),
        nameInput),
      el('div', { class: 'input-group' },
        el('label', { for: 'ct' }, 'MATRIC / CONTACT IDENTIFIER'),
        contactInput),
      el('button', { class: 'btn-coral', onclick: go }, 'Start Quiz →')));

  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });

  mount(topContainer, el('div', { class: 'content-area' }, formCard));
}

/* ─────────────────────────────────────────────────────────────────────
   ACTIVE QUIZ ENGINE
   ───────────────────────────────────────────────────────────────────── */
async function begin(week, course, name, contact) {
  const topContainer = el('div', { class: 'mody-top-container' },
    el('div', { class: 'mody-inner-header' },
      el('span', { class: 'mody-brand' }, 'Loading Exam…')),
    createModyCurveSvg());

  mount(topContainer, el('div', { class: 'content-area' },
    el('div', { class: 'reg-card', style: 'max-width:500px;margin:20px auto;text-align:center' }, 'Fetching test questions…')));

  try {
    const d = await api('/api/quiz?week=' + encodeURIComponent(week.id) + '&course=' + encodeURIComponent(course.id));
    const qs = shuffle(d.questions).map(q => ({ i: q.i, q: q.q, opts: shuffle(q.opts) }));
    S = { week: d.week, course: d.course, name, contact, qs, idx: 0, ans: {}, t0: Date.now(), tpq: d.course.timePerQ };
    guard = true;
    showQ();
  } catch (e) {
    showToast(e.message);
    home();
  }
}

function showQ() {
  clearInterval(timer);
  if (_keyHandler) document.removeEventListener('keydown', _keyHandler);

  const q = S.qs[S.idx],
        n = S.qs.length;

  const timerPill = el('div', { class: 'timer-pill' },
    el('span', { id: 'timerNum' }, S.tpq + 's'));

  const segments = Array.from({ length: n }, (_, i) =>
    el('div', { class: 'segment-item ' + (i <= S.idx ? 'filled' : '') }));

  const topContainer = el('div', { class: 'mody-top-container' },
    el('div', { class: 'mody-inner-header' },
      el('div', { style: 'display:flex;align-items:center;justify-content:space-between;margin-bottom:12px' },
        el('span', { style: 'font-size:13px;font-weight:600;color:rgba(255,255,255,0.7)' }, 'Question ' + pad(S.idx + 1) + ' of ' + pad(n)),
        timerPill),
      el('h2', { class: 'question-title' }, q.q),
      el('div', { class: 'segment-bar' }, ...segments)),
    createModyCurveSvg());

  const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
  const optCards = [];
  const optsWrap = el('div', { class: 'options-wrap' });

  q.opts.forEach((o, oi) => {
    const isSelected = S.ans[q.i] === o;
    const card = el('button', {
      class: 'opt-card',
      'aria-pressed': isSelected ? 'true' : 'false'
    },
      el('span', { class: 'opt-letter' }, letters[oi]),
      el('span', { class: 'opt-text' }, o));

    card.onclick = () => selectOpt(oi);
    optCards.push(card);
    optsWrap.append(card);
  });

  const nextBtn = el('button', {
    class: 'btn-coral',
    style: 'margin-top:24px',
    disabled: !(q.i in S.ans),
    onclick: () => advance()
  }, S.idx === n - 1 ? 'Finish & Submit' : 'Next Question →');

  function selectOpt(oi) {
    S.ans[q.i] = q.opts[oi];
    optCards.forEach((c, ci) => c.setAttribute('aria-pressed', ci === oi ? 'true' : 'false'));
    nextBtn.disabled = false;
  }

  _keyHandler = e => {
    const digit = parseInt(e.key, 10);
    if (digit >= 1 && digit <= q.opts.length) {
      e.preventDefault(); selectOpt(digit - 1); return;
    }
    const charCode = e.key.toUpperCase().charCodeAt(0) - 65;
    if (charCode >= 0 && charCode < q.opts.length) {
      e.preventDefault(); selectOpt(charCode); return;
    }
    if ((e.key === 'Enter' || e.key === ' ') && q.i in S.ans) {
      e.preventDefault(); advance();
    }
  };
  document.addEventListener('keydown', _keyHandler);

  mount(topContainer, el('div', { class: 'content-area' },
    el('div', { class: 'quiz-wrapper' }, optsWrap, nextBtn)));

  const deadline = Date.now() + S.tpq * 1000;
  const numNode = document.getElementById('timerNum');

  timer = setInterval(() => {
    const left = Math.max(0, (deadline - Date.now()) / 1000);
    if (left <= 0) {
      clearInterval(timer);
      advance(true);
      return;
    }
    const secs = Math.ceil(left);
    if (numNode) numNode.textContent = secs + 's';
    timerPill.classList.toggle('urgent', secs <= 5);
  }, 100);
}

function advance() {
  clearInterval(timer);
  if (S.idx < S.qs.length - 1) {
    S.idx++;
    showQ();
  } else {
    submit();
  }
}

/* ─────────────────────────────────────────────────────────────────────
   SUBMISSION & RESULTS
   ───────────────────────────────────────────────────────────────────── */
async function submit() {
  clearInterval(timer);
  if (_keyHandler) { document.removeEventListener('keydown', _keyHandler); _keyHandler = null; }

  const topContainer = el('div', { class: 'mody-top-container' },
    el('div', { class: 'mody-inner-header' },
      el('span', { class: 'mody-brand' }, 'Submitting Assessment')),
    createModyCurveSvg());

  mount(topContainer, el('div', { class: 'content-area' },
    el('div', { class: 'reg-card', style: 'max-width:500px;margin:20px auto;text-align:center' }, 'Grading your answers…')));

  const payload = {
    week: S.week.id,
    course: S.course.id,
    name: S.name,
    contact: S.contact,
    seconds: (Date.now() - S.t0) / 1000,
    answers: Object.entries(S.ans).map(([i, a]) => ({ i: +i, a }))
  };

  try {
    const r = await api('/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    guard = false;
    results(r);
  } catch (e) {
    showToast(e.message);
    mount(topContainer, el('div', { class: 'content-area' },
      el('div', { class: 'reg-card', style: 'max-width:500px;margin:20px auto' },
        el('h3', {}, 'Submission Error'),
        el('p', {}, e.message),
        el('button', { class: 'btn-coral', onclick: submit }, 'Retry Submit'))));
  }
}

function results(r) {
  if (r.percent === 100) launchConfetti();

  const verdict = r.percent >= 80 ? 'Great Job!' : r.percent >= 50 ? 'Good Effort!' : 'Keep Practicing!';
  const topContainer = el('div', { class: 'mody-top-container' },
    el('div', { class: 'mody-inner-header' },
      el('div', { class: 'mody-topbar' },
        el('button', { class: 'header-icon-btn', onclick: home }, '✕'),
        el('span', { class: 'mody-brand' }, 'Assessment Report'),
        el('div', { style: 'width:40px' }))),
    createModyCurveSvg());

  const reviewList = el('div');
  r.review.forEach((x, i) => {
    reviewList.append(
      el('div', { class: 'review-box' },
        el('div', { class: 'review-badge-strip' },
          el('span', { style: 'font-weight:700;font-size:12px;color:var(--text-sub)' }, 'Question ' + (i + 1)),
          el('span', { class: 'review-badge ' + (x.ok ? 'ok' : 'no') }, x.ok ? 'Correct' : 'Incorrect')),
        el('p', { class: 'review-q' }, x.q),
        !x.ok && el('div', { class: 'answer-line bad' }, 'Your Answer: ' + (x.yours === null ? 'None' : x.yours)),
        el('div', { class: 'answer-line good' }, 'Correct Answer: ' + x.correct),
        x.why && el('div', { class: 'review-why' }, x.why)));
  });

  const card = el('div', { class: 'results-card' },
    el('div', { class: 'trophy-ring' },
      el('span', { class: 'pct' }, r.percent + '%')),
    el('h2', {}, verdict),
    el('p', {}, S.name + ' · ' + S.course.title),
    el('div', { class: 'metrics-strip' },
      el('div', { class: 'metric-box' },
        el('b', {}, r.score + ' / ' + r.total),
        el('span', {}, 'Questions Correct')),
      el('div', { class: 'metric-box' },
        el('b', {}, Math.round(r.seconds || 0) + 's'),
        el('span', {}, 'Time Taken'))),
    el('div', { style: 'display:flex;gap:12px;justify-content:center;flex-wrap:wrap;max-width:440px;margin:0 auto' },
      el('button', {
        class: 'btn-coral',
        style: 'flex:1;min-width:180px',
        onclick: () => {
          const w = { id: S.week.id, label: S.week.label };
          nameForm(w, { id: S.course.id, title: S.course.title, count: S.qs.length, timePerQ: S.tpq });
        }
      }, 'Retake Quiz'),
      el('button', {
        class: 'btn-ghost',
        style: 'flex:1;min-width:180px',
        onclick: home
      }, 'Back to Schedule')));

  mount(topContainer, el('div', { class: 'content-area' }, card, reviewList));
}

home();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
