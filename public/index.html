<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18181b">
<meta name="description" content="Weekly course assessments, clean revision, and instant verifiable results.">
<meta property="og:title" content="Weekly Quiz — Student Portal">
<meta property="og:description" content="Take weekly academic quizzes, get instant grading, and review verified solutions.">
<meta property="og:type" content="website">
<title>Weekly Quiz</title>

<!-- High quality typography: Inter & JetBrains Mono -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"></noscript>

<link rel="manifest" href="/manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2318181b'/><text x='16' y='21' font-family='sans-serif' font-weight='800' font-size='15' fill='%23fafafa' text-anchor='middle'>Q</text></svg>">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quiz">

<style>
:root {
  --bg: #09090b;
  --panel: #121215;
  --surface: #18181b;
  --surface-hover: #212126;
  --border: #27272a;
  --border-subtle: #1f1f23;
  --border-active: #52525b;
  
  --text-main: #f4f4f5;
  --text-muted: #a1a1aa;
  --text-faint: #71717a;
  
  --primary: #fafafa;
  --primary-fg: #09090b;
  --accent: #3b82f6;
  --good: #10b981;
  --good-bg: rgba(16, 185, 129, 0.1);
  --bad: #ef4444;
  --bad-bg: rgba(239, 68, 68, 0.1);
  --warn: #f59e0b;

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text-main);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Desktop-adaptive layout container */
.shell {
  max-width: 640px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  padding: 32px 20px calc(96px + env(safe-area-inset-bottom));
}

@media (min-width: 768px) {
  .shell {
    max-width: 720px;
    padding: 48px 32px 100px;
  }
}

/* Header bar */
.site-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--border-subtle);
  margin-bottom: 32px;
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -0.01em;
  color: var(--text-main);
}
.brand-badge {
  width: 24px;
  height: 24px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  display: grid;
  place-items: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 700;
}
.status-pill {
  font-size: 12px;
  color: var(--text-muted);
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  padding: 4px 10px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.status-dot {
  width: 6px;
  height: 6px;
  background: var(--good);
  border-radius: 50%;
}

main { position: relative; }
.hidden { display: none !important; }

/* Micro-animations */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
main > * { animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) both; }

/* Academic minimal cards */
.block {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px;
  margin-bottom: 20px;
  transition: border-color 0.15s ease;
}

.intro h1 {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.025em;
  margin: 0 0 8px;
  line-height: 1.25;
}
.intro p {
  margin: 0;
  color: var(--text-muted);
  font-size: 14.5px;
  line-height: 1.5;
}

.section-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-faint);
  margin: 32px 0 14px;
}

/* Quiz Item Rows */
.quiz-list { display: flex; flex-direction: column; gap: 10px; }
.quiz-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  width: 100%;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px 18px;
  transition: all 0.15s ease;
}
.quiz-row:hover {
  background: var(--surface-hover);
  border-color: var(--border-active);
  transform: translateY(-1px);
}
.quiz-info { flex: 1; min-width: 0; }
.quiz-title {
  display: block;
  font-weight: 600;
  font-size: 15px;
  color: var(--text-main);
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.quiz-meta {
  font-size: 13px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.code-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  background: #27272a;
  color: var(--text-main);
  padding: 2px 6px;
  border-radius: 4px;
}
.quiz-arrow {
  color: var(--text-faint);
  transition: transform 0.15s ease, color 0.15s ease;
  flex-shrink: 0;
}
.quiz-row:hover .quiz-arrow {
  transform: translateX(3px);
  color: var(--text-main);
}

/* Accordion Past Weeks */
details.history-box {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  margin-bottom: 12px;
  overflow: hidden;
}
details.history-box summary {
  list-style: none;
  padding: 16px 18px;
  font-size: 14.5px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  user-select: none;
  background: var(--panel);
  transition: background 0.15s ease;
}
details.history-box summary::-webkit-details-marker { display: none; }
details.history-box summary:hover { background: var(--surface); }
details.history-box summary .sum-meta { font-size: 13px; color: var(--text-muted); font-weight: 400; }
details.history-box .history-content {
  padding: 8px 14px 14px;
  border-top: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* Skeleton Loading State */
@keyframes shimmer {
  0% { opacity: 0.4; }
  50% { opacity: 0.8; }
  100% { opacity: 0.4; }
}
.skel {
  background: #1f1f23;
  border-radius: var(--radius-sm);
  animation: shimmer 1.5s ease-in-out infinite;
}

/* Form Styles */
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text-muted);
  margin-bottom: 20px;
  padding: 4px 0;
  transition: color 0.15s ease;
}
.back-btn:hover { color: var(--text-main); }
.field { margin-bottom: 18px; }
.field label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-muted);
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 13px 14px;
  font-size: 14.5px;
  color: var(--text-main);
  transition: border-color 0.15s ease;
}
.field input:focus {
  border-color: var(--accent);
  outline: none;
}
.field input::placeholder { color: var(--text-faint); }
.guidance-box {
  background: rgba(59, 130, 246, 0.05);
  border: 1px solid rgba(59, 130, 246, 0.2);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  margin-top: 24px;
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.5;
}
.guidance-box b { color: var(--text-main); font-weight: 600; }

/* Active Quiz Interface */
.exam-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 24px;
}
.track-wrap {
  flex: 1;
  height: 6px;
  background: var(--surface);
  border-radius: 999px;
  overflow: hidden;
  border: 1px solid var(--border-subtle);
}
.track-fill {
  height: 100%;
  width: 0;
  background: var(--primary);
  border-radius: 999px;
  transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.exam-chip {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12.5px;
  color: var(--text-muted);
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

/* Question Workspace */
.question-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
}
.q-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.timer-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-main);
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 6px 12px;
  border-radius: 999px;
  transition: all 0.2s ease;
}
.timer-pill.urgent {
  background: var(--bad-bg);
  border-color: var(--bad);
  color: var(--bad);
  animation: pulse 1s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

.question-text {
  font-size: 19px;
  font-weight: 600;
  line-height: 1.45;
  color: var(--text-main);
  letter-spacing: -0.015em;
  margin: 0 0 28px;
}

/* Question Options */
.options-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.option-btn {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 14px;
  text-align: left;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px 18px;
  font-size: 15px;
  font-weight: 500;
  color: var(--text-main);
  transition: all 0.15s ease;
}
.option-btn:hover {
  background: var(--surface);
  border-color: var(--border-active);
}
.option-btn[aria-pressed="true"] {
  background: #1c2230;
  border-color: var(--accent);
  color: #fff;
}
.key-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  background: var(--surface);
  border: 1px solid var(--border);
  width: 26px;
  height: 26px;
  border-radius: 6px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  transition: all 0.15s ease;
}
.option-btn[aria-pressed="true"] .key-badge {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.option-label { flex: 1; line-height: 1.4; }

/* Bottom Action Dock */
.action-dock {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 16px 20px calc(20px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg) 80%, transparent);
  display: flex;
  justify-content: center;
  z-index: 40;
}
.dock-inner {
  width: 100%;
  max-width: 640px;
}
.btn-primary {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--primary);
  color: var(--primary-fg);
  font-weight: 600;
  font-size: 15px;
  border-radius: var(--radius-md);
  padding: 15px;
  transition: opacity 0.15s ease, transform 0.1s ease;
}
.btn-primary:active { transform: scale(0.99); }
.btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }

.btn-secondary {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text-main);
  font-weight: 600;
  font-size: 14.5px;
  border-radius: var(--radius-md);
  padding: 13px;
  margin-top: 10px;
  transition: background 0.15s ease;
}
.btn-secondary:hover { background: var(--surface); }

/* Results & Review Screen */
.score-card {
  text-align: center;
  padding: 40px 24px;
}
.score-circle {
  width: 110px;
  height: 110px;
  margin: 0 auto 20px;
  border-radius: 50%;
  background: var(--panel);
  border: 2px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.score-circle .pct {
  font-family: 'JetBrains Mono', monospace;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.03em;
}
.score-fraction {
  font-size: 14px;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  margin-top: 2px;
}
.score-headline {
  font-size: 24px;
  font-weight: 700;
  margin: 0 0 6px;
  letter-spacing: -0.02em;
}
.score-sub {
  color: var(--text-muted);
  font-size: 14.5px;
  margin: 0 0 20px;
}

.review-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 36px 0 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-subtle);
}
.review-header h2 {
  font-size: 16px;
  font-weight: 600;
  margin: 0;
}
.toggle-filter {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-muted);
  cursor: pointer;
}

.rev-item {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 18px 20px;
  margin-bottom: 12px;
}
.rev-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.rev-index {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text-faint);
}
.rev-badge {
  font-size: 12px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 999px;
}
.rev-badge.ok { background: var(--good-bg); color: var(--good); }
.rev-badge.no { background: var(--bad-bg); color: var(--bad); }

.rev-q {
  font-weight: 600;
  font-size: 15px;
  line-height: 1.45;
  margin: 0 0 14px;
  color: var(--text-main);
}
.rev-answer-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 13.5px;
  line-height: 1.4;
  margin-bottom: 8px;
  color: var(--text-muted);
}
.rev-answer-row strong {
  color: var(--text-main);
  font-weight: 600;
}
.rev-answer-row.correct { color: var(--good); }
.rev-answer-row.wrong { color: var(--bad); }

.rev-why {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed var(--border);
  font-size: 13px;
  color: var(--text-faint);
  line-height: 1.5;
}

/* Toast */
.toast-host {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 99;
  width: calc(100% - 32px);
  max-width: 440px;
  pointer-events: none;
}
.toast {
  background: #18181b;
  border: 1px solid var(--border-active);
  color: var(--text-main);
  border-radius: var(--radius-md);
  padding: 12px 18px;
  font-size: 14px;
  font-weight: 500;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  animation: fadeIn 0.2s ease;
  pointer-events: auto;
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div class="shell">
  <nav class="site-nav" aria-label="Global header">
    <div class="brand">
      <span class="brand-badge">Q</span>
      <span>Weekly Quiz</span>
    </div>
    <div class="status-pill">
      <span class="status-dot"></span>
      <span>Live Assessments</span>
    </div>
  </nav>

  <main id="view" aria-label="Quiz Content" aria-live="polite"></main>
</div>

<div class="action-dock hidden" id="dock">
  <div class="dock-inner">
    <button class="btn-primary" id="dockBtn">Continue</button>
  </div>
</div>

<div class="toast-host hidden" id="toastHost" role="status" aria-live="assertive" aria-atomic="true"></div>

<script>
const $view = document.getElementById('view'),
      $dock = document.getElementById('dock'),
      $dockBtn = document.getElementById('dockBtn'),
      $toastHost = document.getElementById('toastHost');

const pad = n => String(n).padStart(2, '0');

function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    n.append(c.nodeType ? c : document.createTextNode(c));
  }
  return n;
}

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  let j = {};
  try { j = await r.json(); } catch {}
  if (!r.ok) throw new Error(j.error || 'Request failed (' + r.status + ')');
  return j;
}

function mount(...nodes) {
  $view.replaceChildren(...nodes);
  window.scrollTo(0, 0);
}

function dock(label, fn, disabled) {
  $dock.classList.remove('hidden');
  $dockBtn.textContent = label;
  $dockBtn.disabled = !!disabled;
  $dockBtn.onclick = fn;
}

function undock() {
  $dock.classList.add('hidden');
}

let _toastTimer;
function showToast(msg) {
  $toastHost.classList.remove('hidden');
  $toastHost.replaceChildren(el('div', { class: 'toast' }, msg));
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => {
    $toastHost.classList.add('hidden');
    $toastHost.replaceChildren();
  }, 4500);
}

function launchConfetti() {
  const canvas = Object.assign(document.createElement('canvas'), {
    style: 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99',
  });
  document.body.append(canvas);
  const ctx = canvas.getContext('2d');
  canvas.width = innerWidth;
  canvas.height = innerHeight;
  const colours = ['#fafafa', '#3b82f6', '#10b981', '#f59e0b', '#71717a'];
  const pieces = Array.from({ length: 65 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * -canvas.height / 2,
    r: Math.random() * 6 + 3,
    c: colours[Math.floor(Math.random() * colours.length)],
    vx: (Math.random() - 0.5) * 3,
    vy: Math.random() * 3.5 + 1.5,
    rot: Math.random() * 360,
    vr: (Math.random() - 0.5) * 8,
  }));
  let raf;
  (function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
      ctx.restore();
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vy += 0.05;
    });
    if (pieces.some(p => p.y < canvas.height + 10)) raf = requestAnimationFrame(draw);
    else canvas.remove();
  })();
  setTimeout(() => { cancelAnimationFrame(raf); canvas.remove(); }, 3800);
}

let timer = null, S = null, guard = false, _keyHandler = null;
window.addEventListener('beforeunload', e => {
  if (guard) { e.preventDefault(); e.returnValue = ''; }
});

/* ──────────────────── HOME SCREEN ──────────────────────────────────── */
async function home() {
  clearInterval(timer);
  guard = false;
  undock();
  if (_keyHandler) { document.removeEventListener('keydown', _keyHandler); _keyHandler = null; }

  // Clean skeleton state
  mount(
    el('div', { class: 'intro' },
      el('h1', {}, 'Weekly Assessments'),
      el('p', {}, 'Select your module to begin this week’s quiz.')),
    el('div', { class: 'section-label' }, 'Available Quizzes'),
    el('div', { class: 'quiz-list' },
      el('div', { class: 'skel', style: 'height:68px;border-radius:12px' }),
      el('div', { class: 'skel', style: 'height:68px;border-radius:12px' })));

  let weeks;
  try {
    weeks = (await api('/api/weeks')).weeks;
  } catch (e) {
    mount(
      el('div', { class: 'intro' },
        el('h1', {}, 'Weekly Assessments'),
        el('p', {}, 'Unable to reach evaluation server.')),
      el('div', { class: 'block', style: 'margin-top:24px;border-color:var(--bad)' },
        el('p', { style: 'color:var(--bad);margin:0 0 14px' }, e.message),
        el('button', { class: 'btn-primary', onclick: home }, 'Retry connection')));
    return;
  }

  const courseRows = w => w.courses.map(c => el('button', {
    class: 'quiz-row',
    onclick: () => nameForm(w, c),
  },
    el('div', { class: 'quiz-info' },
      el('span', { class: 'quiz-title' }, c.title),
      el('div', { class: 'quiz-meta' },
        c.code ? el('span', { class: 'code-tag' }, c.code) : null,
        el('span', {}, c.count + ' questions'),
        el('span', {}, '•'),
        el('span', {}, c.timePerQ + 's / question'))),
    el('span', { class: 'quiz-arrow' }, '→')));

  const out = [
    el('div', { class: 'intro' },
      el('h1', {}, 'Weekly Assessments'),
      el('p', {}, 'Demonstrate comprehension with timed multiple-choice assessments.'))
  ];

  if (!weeks.length) {
    out.push(el('div', { class: 'block', style: 'text-align:center;color:var(--text-muted);margin-top:24px' },
      'No assessments are currently active. Please check back later.'));
  } else {
    out.push(el('div', { class: 'section-label' }, 'Current Session · ' + weeks[0].label));
    out.push(el('div', { class: 'quiz-list' }, ...courseRows(weeks[0])));

    if (weeks.length > 1) {
      out.push(el('div', { class: 'section-label', style: 'margin-top:36px' }, 'Previous Archives'));
      weeks.slice(1).forEach(w => {
        out.push(el('details', { class: 'history-box' },
          el('summary', {},
            el('span', {}, w.label),
            el('span', { class: 'sum-meta' }, w.courses.length + (w.courses.length === 1 ? ' course' : ' courses'))),
          el('div', { class: 'history-content' }, ...courseRows(w))));
      });
    }
  }

  mount(...out);
}

/* ──────────────────── REGISTRATION FORM ────────────────────────────── */
function nameForm(week, course) {
  undock();
  const name = el('input', {
    id: 'nm',
    autocomplete: 'name',
    placeholder: 'e.g. Adaeze Okafor',
    maxlength: 60,
    value: localStorage.getItem('q_name') || ''
  });
  const contact = el('input', {
    id: 'ct',
    placeholder: 'Matric number, student ID or email',
    maxlength: 80,
    value: localStorage.getItem('q_contact') || ''
  });

  const go = () => {
    const n = name.value.trim().replace(/\s+/g, ' ');
    if (n.length < 2) {
      name.focus();
      name.style.borderColor = 'var(--bad)';
      return;
    }
    localStorage.setItem('q_name', n);
    localStorage.setItem('q_contact', contact.value.trim());
    begin(week, course, n, contact.value.trim());
  };

  mount(
    el('button', { class: 'back-btn', onclick: home }, '← Return to Courses'),
    el('div', { class: 'block' },
      el('div', { class: 'intro' },
        el('h1', {}, course.title),
        el('p', {}, week.label + ' · ' + course.count + ' Questions · ' + course.timePerQ + 's each')),
      el('div', { class: 'field', style: 'margin-top:24px' },
        el('label', { for: 'nm' }, 'Full Name *'),
        name),
      el('div', { class: 'field' },
        el('label', { for: 'ct' }, 'Student Identification / Matriculation (Optional)'),
        contact),
      el('div', { class: 'guidance-box' },
        el('p', { style: 'margin:0 0 6px' }, el('b', {}, 'Examination Rules:')),
        el('p', { style: 'margin:0' }, 'Questions progress automatically when the countdown expires. You cannot return to previous questions. Answers and explanations are revealed upon submission.'))));

  dock('Start Examination', go);
  name.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

/* ──────────────────── QUIZ ENGINE ──────────────────────────────────── */
async function begin(week, course, name, contact) {
  undock();
  mount(
    el('div', { class: 'intro' },
      el('h1', {}, 'Preparing Questions…'),
      el('p', {}, 'Fetching questions from secure evaluation bank.')),
    el('div', { class: 'block', style: 'margin-top:24px' },
      el('div', { class: 'skel', style: 'height:120px;border-radius:12px' })));

  try {
    const d = await api('/api/quiz?week=' + encodeURIComponent(week.id) + '&course=' + encodeURIComponent(course.id));
    const qs = shuffle(d.questions).map(q => ({ i: q.i, q: q.q, opts: shuffle(q.opts) }));
    S = { week: d.week, course: d.course, name, contact, qs, idx: 0, ans: {}, t0: Date.now(), tpq: d.course.timePerQ };
    guard = true;
    showQ();
  } catch (e) {
    mount(
      el('button', { class: 'back-btn', onclick: home }, '← Back'),
      el('div', { class: 'block', style: 'border-color:var(--bad)' },
        el('p', { style: 'color:var(--bad);margin:0' }, e.message)));
  }
}

function showQ() {
  clearInterval(timer);
  if (_keyHandler) document.removeEventListener('keydown', _keyHandler);

  const q = S.qs[S.idx],
        n = S.qs.length,
        answered = Object.keys(S.ans).length;

  const timerEl = el('span', { class: 'timer-pill', role: 'timer', 'aria-label': 'Time remaining' },
    el('span', { id: 'timerNum' }, S.tpq + 's'));

  const optsEl = el('ul', { class: 'options-list', role: 'group', 'aria-labelledby': 'qtext' });
  const optBtns = [];
  const keys = ['A', 'B', 'C', 'D', 'E', 'F'];

  const refreshDock = () => dock(S.idx === n - 1 ? 'Complete & Submit' : 'Next Question', advance, !(q.i in S.ans));

  q.opts.forEach((o, oi) => {
    const b = el('button', {
      class: 'option-btn',
      'aria-pressed': S.ans[q.i] === o ? 'true' : 'false'
    },
      el('span', { class: 'key-badge' }, keys[oi] || String(oi + 1)),
      el('span', { class: 'option-label' }, o));

    b.onclick = () => selectOpt(oi);
    optBtns.push(b);
    optsEl.append(el('li', {}, b));
  });

  function selectOpt(oi) {
    S.ans[q.i] = q.opts[oi];
    optBtns.forEach((x, xi) => x.setAttribute('aria-pressed', xi === oi ? 'true' : 'false'));
    const badge = document.getElementById('ansCount');
    if (badge) badge.textContent = pad(Object.keys(S.ans).length) + ' of ' + n;
    refreshDock();
  }

  // Keyboard navigation: 1-4 or A-D
  _keyHandler = e => {
    if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
    const digit = parseInt(e.key, 10);
    if (digit >= 1 && digit <= q.opts.length) {
      e.preventDefault(); selectOpt(digit - 1); return;
    }
    const charCode = e.key.toUpperCase().charCodeAt(0) - 65;
    if (charCode >= 0 && charCode < q.opts.length) {
      e.preventDefault(); selectOpt(charCode); return;
    }
    if ((e.key === 'Enter' || e.key === ' ') && q.i in S.ans) {
      e.preventDefault(); advance();
    }
  };
  document.addEventListener('keydown', _keyHandler);

  mount(
    el('div', { class: 'exam-bar' },
      el('span', { class: 'exam-chip' }, 'Q ' + pad(S.idx + 1) + ' / ' + pad(n)),
      el('div', { class: 'track-wrap' },
        el('div', { class: 'track-fill', style: 'width:' + ((S.idx + 1) / n * 100) + '%' })),
      el('span', { class: 'exam-chip', id: 'ansCount' }, pad(answered) + ' of ' + pad(n))),
    el('div', { class: 'block' },
      el('div', { class: 'question-header' },
        el('span', { class: 'q-badge' }, S.course.code || S.course.title),
        timerEl),
      el('h2', { class: 'question-text', id: 'qtext' }, q.q),
      optsEl));

  refreshDock();

  const deadline = Date.now() + S.tpq * 1000;
  const numNode = document.getElementById('timerNum');

  timer = setInterval(() => {
    const left = Math.max(0, (deadline - Date.now()) / 1000);
    if (left <= 0) {
      clearInterval(timer);
      advance(true);
      return;
    }
    const secs = Math.ceil(left);
    if (numNode) numNode.textContent = secs + 's';
    timerEl.classList.toggle('urgent', secs <= 5);
  }, 100);
}

function advance() {
  clearInterval(timer);
  if (S.idx < S.qs.length - 1) {
    S.idx++;
    showQ();
  } else {
    submit();
  }
}

/* ──────────────────── SUBMIT & REVIEW ──────────────────────────────── */
async function submit() {
  clearInterval(timer);
  undock();
  if (_keyHandler) { document.removeEventListener('keydown', _keyHandler); _keyHandler = null; }

  mount(
    el('div', { class: 'intro' },
      el('h1', {}, 'Grading Assessment…'),
      el('p', {}, 'Submitting verified results to database.')),
    el('div', { class: 'block', style: 'margin-top:24px' },
      el('div', { class: 'skel', style: 'height:80px;border-radius:12px' })));

  const payload = {
    week: S.week.id,
    course: S.course.id,
    name: S.name,
    contact: S.contact,
    seconds: (Date.now() - S.t0) / 1000,
    answers: Object.entries(S.ans).map(([i, a]) => ({ i: +i, a }))
  };

  try {
    const r = await api('/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    guard = false;
    results(r);
  } catch (e) {
    mount(
      el('div', { class: 'block', style: 'border-color:var(--bad);margin-top:40px' },
        el('h2', { style: 'margin:0 0 8px;font-size:18px;color:var(--bad)' }, 'Submission Failed'),
        el('p', { style: 'color:var(--text-muted);margin:0 0 16px' }, e.message + ' Your answers are intact.'),
        el('button', { class: 'btn-primary', onclick: submit }, 'Retry Submission')));
    showToast(e.message);
  }
}

function results(r) {
  undock();
  if (r.percent === 100) launchConfetti();

  const verdict = r.percent >= 80 ? 'Mastery Achieved' : r.percent >= 60 ? 'Satisfactory' : 'Needs Review';
  let onlyWrong = false;
  const reviewContainer = el('div');

  const drawReview = () => {
    reviewContainer.replaceChildren(
      ...r.review
        .map((x, i) => ({ x, i }))
        .filter(({ x }) => !onlyWrong || !x.ok)
        .map(({ x, i }) =>
          el('div', { class: 'rev-item' },
            el('div', { class: 'rev-top' },
              el('span', { class: 'rev-index' }, 'Question ' + (i + 1)),
              el('span', { class: 'rev-badge ' + (x.ok ? 'ok' : 'no') }, x.ok ? 'Correct' : x.yours === null ? 'Unanswered' : 'Incorrect')),
            el('p', { class: 'rev-q' }, x.q),
            !x.ok && el('div', { class: 'rev-answer-row wrong' },
              el('strong', {}, 'Your selection:'),
              el('span', {}, x.yours === null ? 'None' : x.yours)),
            el('div', { class: 'rev-answer-row ' + (x.ok ? 'correct' : '') },
              el('strong', {}, 'Correct answer:'),
              el('span', {}, x.correct)),
            x.why && el('div', { class: 'rev-why' },
              el('strong', { style: 'color:var(--text-muted)' }, 'Explanation: '),
              x.why))));
  };

  const toggle = el('input', {
    type: 'checkbox',
    onchange: e => { onlyWrong = e.target.checked; drawReview(); }
  });

  drawReview();

  mount(
    el('div', { class: 'block score-card' },
      el('div', { class: 'score-circle' },
        el('span', { class: 'pct' }, r.percent + '%'),
        el('span', { class: 'score-fraction' }, r.score + ' / ' + r.total)),
      el('h1', { class: 'score-headline' }, verdict),
      el('p', { class: 'score-sub' }, S.name + ' · ' + S.course.title),
      el('div', { style: 'display:flex;gap:10px;justify-content:center;flex-wrap:wrap' },
        el('button', {
          class: 'btn-primary',
          style: 'width:auto;padding:11px 22px',
          onclick: () => {
            const w = { id: S.week.id, label: S.week.label };
            nameForm(w, { id: S.course.id, title: S.course.title, count: S.qs.length, timePerQ: S.tpq });
          }
        }, 'Retake Quiz'),
        el('button', {
          class: 'btn-secondary',
          style: 'width:auto;margin:0;padding:11px 22px',
          onclick: home
        }, 'Return to Dashboard'))),
    el('div', { class: 'review-header' },
      el('h2', {}, 'Detailed Question Breakdown'),
      el('label', { class: 'toggle-filter' },
        toggle,
        'Mistakes only')),
    reviewContainer);
}

home();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
